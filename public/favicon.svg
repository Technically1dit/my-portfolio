<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vs-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3d2e"/>
      <stop offset="100%" stop-color="#051f17"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#vs-grad)" stroke="#22c55e" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Neural Accent Node -->
  <circle cx="50" cy="14" r="3.5" fill="url(#accent-grad)"/>
  <circle cx="50" cy="14" r="6" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1" fill="none"/>
  
  <!-- VS Monogram Typography -->
  <text x="31" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fraunces', serif" font-size="27" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    VS
  </text>
  <!-- Dot Accent -->
  <circle cx="49" cy="40" r="2.5" fill="url(#accent-grad)"/>
</svg>
